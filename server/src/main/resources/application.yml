spring:
  application:
    name: woojugonggang-server
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/woojugonggang;MODE=MySQL;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

app:
  demo-password: ${APP_DEMO_PASSWORD:admin}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

